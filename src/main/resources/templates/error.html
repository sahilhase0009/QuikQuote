<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — QuikQuote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-5 text-center">
        <div class="card card-custom p-5 shadow-sm" style="max-width: 500px; width: 100%;">
            <div class="mb-3 text-warning">
                <i class="bi bi-exclamation-triangle display-1"></i>
            </div>

            <h2 class="fw-bold text-dark mb-2" th:text="${error != null ? error : 'Something Went Wrong'}">Error</h2>

            <p class="text-muted mb-4" th:text="${message != null ? message : 'An unexpected error occurred. Please navigate back to your dashboard.'}">
                An unexpected request issue occurred.
            </p>

            <div>
                <a th:href="@{/dashboard}" class="btn btn-primary-custom px-4 py-2"><i class="bi bi-house me-2"></i>Return to Dashboard</a>
            </div>
        </div>
    </div>

</body>
</html>
