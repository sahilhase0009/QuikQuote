<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — QuikQuote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-5">
        <div class="mb-4 text-center">
            <a href="/" class="navbar-brand text-dark fs-2">
                <i class="bi bi-file-earmark-text-fill text-primary me-2"></i>Quik<span class="text-primary">Quote</span>
            </a>
            <p class="text-muted small mb-0">Sign in to your business workspace</p>
        </div>

        <div class="card card-custom p-4 shadow-sm" style="max-width: 420px; width: 100%;">

            <div th:if="${param.error}" class="alert alert-danger py-2 small">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid email or password.
            </div>

            <div th:if="${param.logout}" class="alert alert-success py-2 small">
                <i class="bi bi-check-circle-fill me-1"></i> You have been logged out successfully.
            </div>

            <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-muted small">Email Address</label>
                    <input type="email" class="form-control" id="username" name="username" placeholder="name@company.com" required value="demo@primeoffice.com">
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label for="password" class="form-label fw-semibold text-muted small">Password</label>
                    </div>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required value="password123">
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2">Sign In</button>
            </form>

            <div class="mt-4 p-3 bg-light rounded text-center border">
                <div class="fw-bold text-dark small mb-1"><i class="bi bi-person-badge text-primary me-1"></i> Demo Credentials</div>
                <div class="text-muted small">Email: <code>demo@primeoffice.com</code></div>
                <div class="text-muted small">Password: <code>password123</code></div>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted small">Don't have an account?</span>
                <a th:href="@{/register}" class="fw-semibold text-primary ms-1 small">Create an Account</a>
            </div>
        </div>
    </div>

</body>
</html>
