<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Product — QuikQuote' : 'New Product — QuikQuote'}">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-quoteflow sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand me-4" href="/dashboard"><i class="bi bi-file-earmark-text-fill me-2"></i>Quik<span>Quote</span></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/quotations}">Quotations</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/customers}">Customers</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/products}">Products & Services</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 720px;">
        <div class="mb-3">
            <a th:href="@{/products}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Products</a>
        </div>

        <div class="card card-custom p-4">
            <h4 class="fw-bold mb-4" th:text="${isEdit ? 'Edit Product / Service' : 'Add New Product / Service'}">Product Form</h4>

            <form th:action="${isEdit ? '/products/edit/' + product.id : '/products'}" th:object="${product}" method="post">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label for="name" class="form-label fw-semibold text-muted small">Item Name *</label>
                        <input type="text" class="form-control" th:field="*{name}" placeholder="Office Chair" required>
                    </div>

                    <div class="col-md-4">
                        <label for="category" class="form-label fw-semibold text-muted small">Category</label>
                        <input type="text" class="form-control" th:field="*{category}" placeholder="Furniture, Service, IT...">
                    </div>

                    <div class="col-md-4">
                        <label for="unit" class="form-label fw-semibold text-muted small">Unit *</label>
                        <select class="form-select" th:field="*{unit}">
                            <option value="Piece">Piece</option>
                            <option value="Hour">Hour</option>
                            <option value="Day">Day</option>
                            <option value="Project">Project</option>
                            <option value="Service">Service</option>
                            <option value="Kg">Kg</option>
                            <option value="Sq Ft">Sq Ft</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="price" class="form-label fw-semibold text-muted small">Unit Price (₹) *</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{price}" placeholder="4500.00" required>
                    </div>

                    <div class="col-md-4">
                        <label for="taxPercentage" class="form-label fw-semibold text-muted small">Tax Percentage (%)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{taxPercentage}" placeholder="18.00">
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold text-muted small">Item Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" placeholder="High-back mesh ergonomic chair with lumbar support..."></textarea>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck" checked>
                            <label class="form-check-label fw-semibold text-dark small" for="activeCheck">
                                Active item (visible in quotation creation dropdown)
                            </label>
                        </div>
                    </div>

                    <div class="col-12 text-end mt-4">
                        <a th:href="@{/products}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom px-4" th:text="${isEdit ? 'Update Item' : 'Save Item'}">Save</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
