# Application Details
spring.application.name=QuikQuote

# Database Settings
spring.datasource.url=${DB_URL:jdbc:h2:mem:quoteflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hikari Connection Pool Resiliency Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging/dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# QuoteFlow AI Configuration
quoteflow.ai.openai-api-key=${OPENAI_API_KEY:}
quoteflow.ai.mock-mode=${MOCK_AI_MODE:true}
quoteflow.ai.openai-model=gpt-3.5-turbo

# Server Port (Binds dynamically to Render's ${PORT} or defaults to 8080)
server.port=${PORT:8080}
